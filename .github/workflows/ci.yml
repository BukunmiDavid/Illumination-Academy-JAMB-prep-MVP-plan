name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate + validate question bank
        run: python build/build_questions.py
      - name: Data integrity + grading keys
        run: python build/qa_check.py
      - name: Backend compiles
        run: python -m py_compile api/app/*.py
      - name: Generated files in sync with source of truth
        run: git diff --exit-code -- build data web/src/data
      - name: No secret env files tracked
        run: |
          if git ls-files | grep -qE '(^|/)\.env$'; then
            echo "::error::A .env file is tracked in git:"
            git ls-files | grep -E '(^|/)\.env$'
            exit 1
          fi

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Build (tsc --noEmit + vite)
        working-directory: web
        run: npm run build
      - name: KaTeX renders every math block
        working-directory: web
        run: node scripts/qa_katex.mjs